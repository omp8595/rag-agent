[project]
name = "context-layer"
version = "0.1.0"
description = "Life Sciences Enterprise Context Layer prototype"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6",
    "scikit-learn>=1.9",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["context_layer*"]
