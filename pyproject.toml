[project]
name = "context-layer"
version = "0.1.0"
description = "Life Sciences Enterprise Context Layer prototype"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6",
    "scikit-learn>=1.9",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "mcp>=1.9,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
eval = ["deepeval>=4.0", "anthropic>=1.0", "openai>=1.0"]
# Separate extra: ragas has a known packaging issue as of 0.4.3 (its
# ragas.llms.base unconditionally imports langchain_community.chat_models.vertexai,
# which doesn't exist in any langchain-community release compatible with the
# rest of the current langchain 1.x line) - see docs/evaluation.md. The
# ragas adapter degrades to `skipped` gracefully either way, so it's not a
# hard dependency of `eval`.
eval-ragas = ["ragas"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["context_layer*"]
